<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elijah Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  /* ========= COLORS (black & white) — change these to restyle everything ========= */
  :root {
    --bg:          rgba(8, 8, 8, 0.94);
    --bg-2:        rgba(18, 18, 18, 0.96);
    --line:        rgba(255, 255, 255, 0.10);
    --line-strong: rgba(255, 255, 255, 0.28);
    --text:        #ffffff;
    --text-dim:    #9a9a9a;
    --text-faint:  #5c5c5c;
    --hover-bg:    #ffffff;   /* highlighted row background */
    --hover-text:  #000000;   /* highlighted row text */
    --menu-width:  380px;
    --rows:        9;        /* how many rows are visible before scrolling */
    --row-h:       38px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }

  /* ================= MENU ================= */
  #menu {
    position: absolute;
    width: var(--menu-width);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: opacity .15s ease, transform .15s ease;
  }
  #menu.closed { opacity: 0; transform: scale(0.98); pointer-events: none; }
  /* positions (set by "Menu Positioning" in settings) */
  #menu.x-left   { left: 40px; }
  #menu.x-center { left: 50%; margin-left: calc(var(--menu-width) / -2); }
  #menu.x-right  { right: 40px; }
  #menu.y-top    { top: 40px; }
  #menu.y-middle { top: 50%; transform: translateY(-50%); }
  #menu.y-middle.closed { transform: translateY(-50%) scale(0.98); }
  #menu.y-bottom { bottom: 40px; }

  .banner {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .header {
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .brand {
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .brand h1 {
    font-size: 26px; font-weight: 800; letter-spacing: 6px;
  }
  .brand span {
    font-size: 10px; font-weight: 600; letter-spacing: 2px;
    color: var(--text-dim); text-transform: uppercase;
  }
  .path {
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .path b { color: var(--text); font-weight: 700; }

  .cats {
    display: flex; gap: 2px;
    padding: 8px 10px 0;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .cat {
    flex: 1; text-align: center; white-space: nowrap;
    padding: 8px 6px 9px;
    font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-faint);
    border-bottom: 2px solid transparent;
  }
  .cat.active { color: var(--text); border-bottom-color: var(--text); }
  .cats-hint {
    display: flex; justify-content: space-between;
    padding: 4px 12px 0; font-size: 9px; color: var(--text-faint);
    letter-spacing: 1px;
  }

  .list {
    position: relative;
    max-height: calc(var(--row-h) * var(--rows) + 12px);
    overflow: hidden;
    padding: 6px;
  }
  .row {
    height: var(--row-h);
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 13px; font-weight: 500;
    color: var(--text);
    transition: background .08s ease, color .08s ease;
  }
  .row .icon { width: 16px; font-size: 16px; color: var(--text-dim); text-align: center; }
  .row .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .right { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 12px; }
  .row.disabled { opacity: .35; }

  .row.active { background: var(--hover-bg); color: var(--hover-text); }
  .row.active .icon,
  .row.active .right { color: var(--hover-text); }

  .divider {
    height: 28px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; margin-top: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-faint);
  }
  .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* checkbox */
  .check {
    width: 30px; height: 16px; border-radius: 10px;
    border: 1.5px solid var(--line-strong);
    position: relative; transition: all .12s ease;
  }
  .check::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-faint); transition: all .12s ease;
  }
  .check.on { background: var(--text); border-color: var(--text); }
  .check.on::after { left: 16px; background: #000; }
  .row.active .check { border-color: rgba(0,0,0,.35); }
  .row.active .check::after { background: rgba(0,0,0,.4); }
  .row.active .check.on { background: #000; border-color: #000; }
  .row.active .check.on::after { background: #fff; }

  /* scrollable */
  .scroll-val { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .scroll-val i { font-size: 11px; opacity: .6; }
  .scroll-val .count { font-size: 10px; opacity: .5; font-weight: 500; }

  /* slider */
  .slider { display: flex; align-items: center; gap: 8px; }
  .slider .track { width: 80px; height: 3px; background: var(--line-strong); border-radius: 2px; position: relative; }
  .slider .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); border-radius: 2px; }
  .row.active .slider .track { background: rgba(0,0,0,.2); }
  .row.active .slider .fill { background: #000; }
  .slider .num { font-family: "JetBrains Mono", monospace; font-size: 11px; min-width: 34px; text-align: right; }

  .scrollbar {
    position: absolute; right: 2px; top: 6px; bottom: 6px; width: 2px;
    background: transparent;
  }
  .scrollbar div { position: absolute; left: 0; right: 0; background: var(--line-strong); border-radius: 2px; }

  .desc {
    border-top: 1px solid var(--line);
    padding: 12px 18px;
    font-size: 12px; line-height: 1.5; color: var(--text-dim);
    min-height: 42px;
  }
  .meta {
    border-top: 1px solid var(--line);
    padding: 10px 18px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px;
    font-size: 11px;
  }
  .meta div { display: flex; justify-content: space-between; gap: 8px; }
  .meta span:first-child { color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
  .meta span:last-child { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 18px;
    border-top: 1px solid var(--line);
    background: var(--bg-2);
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-faint);
  }
  .footer b { color: var(--text-dim); font-weight: 600; }

  /* ================= LOADING (startInjection) ================= */
  #loader {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55);
    transition: opacity .4s ease;
  }
  #loader.fade { opacity: 0; }
  .loader-box { width: 320px; text-align: center; }
  .loader-box h1 { font-size: 44px; font-weight: 800; letter-spacing: 14px; margin-right: -14px; }
  .loader-box p { margin-top: 6px; font-size: 11px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
  .bar { margin-top: 22px; height: 2px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--text); }

  /* ================= NOTIFICATIONS ================= */
  #notifs {
    position: absolute; top: 30px; right: 30px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .notif {
    width: 300px; display: flex; gap: 12px;
    padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--line);
    border-left: 3px solid var(--text);
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    animation: nin .2s ease;
    position: relative; overflow: hidden;
  }
  .notif.error { border-left-style: dashed; }
  .notif.info  { border-left-color: var(--text-dim); }
  .notif i { font-size: 20px; margin-top: 1px; }
  .notif .t { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .notif .d { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }
  .notif .timer { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--line-strong); }
  .notif.out { animation: nout .2s ease forwards; }
  @keyframes nin  { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes nout { to   { opacity: 0; transform: translateX(20px); } }

  /* ================= KEYBOARD INPUT ================= */
  #keyboard {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45);
  }
  .kb-box {
    width: 420px; padding: 22px;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px;
  }
  .kb-box .t { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
  .kb-input {
    margin-top: 12px; padding: 12px 14px;
    border: 1px solid var(--line-strong); border-radius: 4px;
    font-family: "JetBrains Mono", monospace; font-size: 15px;
    min-height: 46px; white-space: pre;
  }
  .kb-input::after { content: "|"; animation: blink 1s steps(1) infinite; color: var(--text-dim); }
  @keyframes blink { 50% { opacity: 0; } }
  .kb-hint { margin-top: 10px; font-size: 10px; letter-spacing: 1px; color: var(--text-faint); text-transform: uppercase; }

  /* ================= SIDE PANELS (keybinds / spectators) ================= */
  #panels {
    position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 12px; width: 240px;
  }
  .panel {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .panel h3 {
    padding: 10px 14px; font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text-dim);
    border-bottom: 1px solid var(--line); background: var(--bg-2);
    display: flex; justify-content: space-between;
  }
  .panel ul { list-style: none; padding: 6px 0; }
  .panel li {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 5px 14px; font-size: 12px;
  }
  .panel li .k {
    font-family: "JetBrains Mono", monospace; font-size: 10px;
    padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 3px; color: var(--text-dim);
  }
  .panel li .s { color: var(--text-faint); font-size: 11px; }
  .panel li.on .s { color: var(--text); }
  .panel .empty { padding: 10px 14px; font-size: 11px; color: var(--text-faint); }

  /* ================= FREECAM ================= */
  #freecam {
    position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
    min-width: 360px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 16px; text-align: center;
  }
  #freecam .t { font-size: 10px; letter-spacing: 3px; color: var(--text-faint); text-transform: uppercase; }
  #freecam .opts { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 8px; }
  #freecam .opts span { font-size: 12px; color: var(--text-faint); }
  #freecam .opts span.cur { font-size: 15px; font-weight: 700; color: var(--text); }
  #freecam .sub { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  #freecam .sub b { color: var(--text); }
  #freecam .keys { margin-top: 8px; font-size: 9px; letter-spacing: 1px; color: var(--text-faint); text-transform: uppercase; }
  .crosshair {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #000;
  }

  /* ================= FOV CIRCLE ================= */
  #fov {
    position: absolute; left: 50%; top: 50%;
    border: 1px solid rgba(255,255,255,.6); border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loader" class="hidden">
  <div class="loader-box">
    <h1>ELIJAH</h1>
    <p id="loader-text">Injecting</p>
    <div class="bar"><div id="loader-bar"></div></div>
  </div>
</div>

<!-- Main menu -->
<div id="menu" class="closed x-left y-top">
  <div class="banner"><img src="intro.gif" alt="Elijah"></div>
  <div class="header">
    <div class="path" id="path">Main Menu</div>
  </div>
  <div id="cats-wrap" class="hidden">
    <div class="cats" id="cats"></div>
    <div class="cats-hint"><span>&larr; Q</span><span>E &rarr;</span></div>
  </div>
  <div class="list" id="list"></div>
  <div class="meta hidden" id="meta"></div>
  <div class="desc" id="desc"></div>
  <div class="footer">
    <span id="user"><b>User</b></span>
    <span id="counter">0 / 0</span>
    <span id="exp">Exp <b>N/A</b></span>
  </div>
</div>

<div id="notifs"></div>

<div id="keyboard" class="hidden">
  <div class="kb-box">
    <div class="t" id="kb-title">Input</div>
    <div class="kb-input" id="kb-value"></div>
    <div class="kb-hint">Enter to confirm &nbsp;·&nbsp; Esc to cancel</div>
  </div>
</div>

<div id="panels">
  <div class="panel hidden" id="binds-panel"><h3>Keybinds</h3><ul id="binds"></ul></div>
  <div class="panel hidden" id="specs-panel"><h3><span>Spectators</span><span id="spec-count">0</span></h3><ul id="specs"></ul></div>
</div>

<div id="freecam-wrap" class="hidden">
  <div class="crosshair"></div>
  <div id="freecam">
    <div class="t">Freecam</div>
    <div class="opts" id="fc-opts"></div>
    <div class="sub" id="fc-sub"></div>
    <div class="keys">Scroll: mode &nbsp;·&nbsp; Q / E: change &nbsp;·&nbsp; Left click: use</div>
  </div>
</div>

<div id="fov" class="hidden"></div>

<script>
(function () {
  "use strict";

  // ---------- Freecam data (must match the lists in Elijah Dui.lua, lines 184-188) ----------
  var FC_OPTIONS = ["Default", "Teleport", "Shoot Weapon", "Shoot Vehicle", "Map Destroyer", "Spawn Object", "Helicopter Attack"];
  var FC_WEAPONS = ["WEAPON_APPISTOL", "WEAPON_PISTOL", "WEAPON_SMG", "WEAPON_ASSAULTRIFLE", "WEAPON_RPG", "WEAPON_PERMKILL", "WEAPON_AIRSTRIKE_ROCKET"];
  var FC_VEHICLES = ["Adder", "Zentorno", "Comet", "Banshee", "Trash", "Dump"];
  var FC_MAPS = ["City", "Docks", "Playa Vista", "Mountain", "Pink Cage", "Vespucci", "Mega Mall", "Platform", "Big Ring", "Tube", "Dessert", "Goal", "Big Statue 2", "House"];
  var FC_OBJECTS = ["Big Tires", "Dome", "Black Surface", "Spinning Object", "Arena Fire", "Landmine", "Big Wheels", "Cnt Arena", "Arena Skull", "Arena Bomb", "Waste Rims"];

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    elements: [],
    index: 0,
    path: [],
    categories: null,
    categoryIndex: 0,
    scrollTop: 0,
    fc: { option: 0, weapon: 1, vehicle: 1, map: 1, object: 1 }
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Lua sends tables with numeric keys sometimes as objects – normalize to arrays.
  function arr(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v;
    if (typeof v === "object") {
      return Object.keys(v).sort(function (a, b) { return a - b; }).map(function (k) { return v[k]; });
    }
    return [];
  }

  function fmtNum(n, step) {
    n = Number(n) || 0;
    var dec = 0;
    if (step != null && String(step).indexOf(".") !== -1) {
      dec = Math.min(String(step).split(".")[1].length, 2);
    } else if (n % 1 !== 0) {
      dec = 2;
    }
    if (step != null && Number(step) % 1 === 0 && n % 1 === 0) dec = 0;
    return n.toFixed(dec);
  }

  // ================= MENU RENDER =================
  function rightSide(el) {
    var t = el.type;
    var html = "";
    if (t === "subMenu") {
      html = '<i class="ph ph-caret-right"></i>';
    } else if (t === "checkbox") {
      html = '<div class="check' + (el.checked ? " on" : "") + '"></div>';
    } else if (t === "scrollable" || t === "scrollable-checkbox") {
      var vals = arr(el.values);
      var v = Math.max(1, Math.min(vals.length, el.value || 1));
      html = '<div class="scroll-val"><i class="ph ph-caret-left"></i>' + esc(vals[v - 1]) +
             '<i class="ph ph-caret-right"></i><span class="count">' + v + "/" + vals.length + "</span></div>";
      if (t === "scrollable-checkbox") html += '<div class="check' + (el.checked ? " on" : "") + '"></div>';
    } else if (t === "slider" || t === "slider-checkbox") {
      var min = el.min != null ? Number(el.min) : 0;
      var max = el.max != null ? Number(el.max) : 100;
      var val = el.value != null ? Number(el.value) : min;
      var pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
      html = '<div class="slider"><div class="track"><div class="fill" style="width:' +
             Math.max(0, Math.min(100, pct)) + '%"></div></div><span class="num">' + fmtNum(val, el.step) + "</span></div>";
      if (t === "slider-checkbox") html += '<div class="check' + (el.checked ? " on" : "") + '"></div>';
    } else if (t === "button") {
      html = "";
    }
    return html;
  }

  function rowHTML(el, i) {
    if (!el) return "";
    if (el.type === "divider") {
      return '<div class="divider">' + esc(el.label) + "</div>";
    }
    var icon = el.icon ? '<i class="icon ' + esc(el.icon) + '"></i>' : "";
    var cls = "row" + (i === state.index ? " active" : "") + (el.disabled ? " disabled" : "");
    return '<div class="' + cls + '" data-i="' + i + '">' + icon +
           '<span class="label">' + esc(el.label) + '</span><span class="right">' + rightSide(el) + "</span></div>";
  }

  function renderList() {
    var list = $("list");
    var els = state.elements;
    var html = "";
    for (var i = 0; i < els.length; i++) html += rowHTML(els[i], i);
    if (!els.length) html = '<div class="divider">Empty</div>';
    list.innerHTML = html + '<div class="scrollbar"><div id="thumb"></div></div>';
    keepInView();
    renderInfo();
  }

  function keepInView() {
    var list = $("list");
    var active = list.querySelector(".row.active");
    if (active) {
      var top = active.offsetTop - 6;
      var bottom = active.offsetTop + active.offsetHeight + 6;
      if (top < list.scrollTop) list.scrollTop = top;
      else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight;
      if (state.index === 0) list.scrollTop = 0;
    }
    // scrollbar thumb
    var thumb = $("thumb");
    var bar = thumb && thumb.parentNode;
    if (thumb) {
      if (list.scrollHeight <= list.clientHeight + 2) {
        thumb.style.display = "none";
      } else {
        thumb.style.display = "block";
        var ratio = list.clientHeight / list.scrollHeight;
        thumb.style.height = Math.max(20, ratio * (list.clientHeight - 12)) + "px";
        thumb.style.top = (list.scrollTop / list.scrollHeight) * (list.clientHeight - 12) + "px";
        bar.style.top = 6 + list.scrollTop + "px";
        bar.style.bottom = "auto";
        bar.style.height = (list.clientHeight - 12) + "px";
      }
    }
  }

  function renderInfo() {
    var el = state.elements[state.index];
    $("desc").textContent = (el && el.desc) || (el && el.label) || "";
    // counter (skip dividers)
    var total = 0, pos = 0;
    for (var i = 0; i < state.elements.length; i++) {
      if (state.elements[i] && state.elements[i].type !== "divider") {
        total++;
        if (i <= state.index) pos = total;
      }
    }
    $("counter").textContent = pos + " / " + total;

    // player metadata (Online player list)
    var meta = $("meta");
    var md = el ? arr(el.metaData) : [];
    if (md.length) {
      meta.innerHTML = md.map(function (m) {
        return "<div><span>" + esc(m.key) + "</span><span>" + esc(m.value) + "</span></div>";
      }).join("");
      meta.classList.remove("hidden");
    } else {
      meta.classList.add("hidden");
    }
  }

  function renderHeader() {
    var p = arr(state.path);
    if (!p.length) {
      $("path").innerHTML = "<b>Main Menu</b>";
    } else {
      $("path").innerHTML = p.map(function (s, i) {
        return i === p.length - 1 ? "<b>" + esc(s) + "</b>" : esc(s);
      }).join(" &nbsp;/&nbsp; ");
    }
    var cats = arr(state.categories);
    if (cats.length) {
      $("cats").innerHTML = cats.map(function (c, i) {
        return '<div class="cat' + (i === state.categoryIndex ? " active" : "") + '">' + esc(c.label) + "</div>";
      }).join("");
      $("cats-wrap").classList.remove("hidden");
    } else {
      $("cats-wrap").classList.add("hidden");
    }
  }

  function applyMenuData(d) {
    if (d.elements !== undefined) state.elements = arr(d.elements);
    if (d.index !== undefined) state.index = Number(d.index) || 0;
    if (d.path !== undefined) state.path = arr(d.path);
    if (d.categories !== undefined) {
      state.categories = d.categories;
      state.categoryIndex = Number(d.categoryIndex) || 0;
    } else if (d.elements !== undefined) {
      state.categories = null;
    }
    renderHeader();
    renderList();
  }

  function setHover(i) {
    var list = $("list");
    var prev = list.querySelector(".row.active");
    if (prev) prev.classList.remove("active");
    state.index = Number(i) || 0;
    var next = list.querySelector('.row[data-i="' + state.index + '"]');
    if (next) next.classList.add("active");
    keepInView();
    renderInfo();
  }

  // ================= LOADER =================
  function startInjection() {
    var loader = $("loader"), bar = $("loader-bar"), text = $("loader-text");
    var steps = ["Injecting", "Loading modules", "Building menu", "Ready"];
    loader.classList.remove("hidden", "fade");
    var start = Date.now(), dur = 4600;
    (function tick() {
      var p = Math.min(1, (Date.now() - start) / dur);
      bar.style.width = (p * 100) + "%";
      text.textContent = steps[Math.min(steps.length - 1, Math.floor(p * steps.length))];
      if (p < 1) requestAnimationFrame(tick);
      else {
        loader.classList.add("fade");
        setTimeout(function () { loader.classList.add("hidden"); }, 400);
      }
    })();
  }

  // ================= NOTIFICATIONS =================
  function notify(d) {
    var type = d.type || "info";
    var icons = { success: "ph-check-circle", error: "ph-x-circle", info: "ph-info" };
    var dur = Number(d.duration) || 3000;
    var n = document.createElement("div");
    n.className = "notif " + type;
    n.innerHTML = '<i class="ph ' + (icons[type] || icons.info) + '"></i><div><div class="t">' + esc(d.title || "Elijah") +
                  '</div><div class="d">' + esc(d.desc) + '</div></div><div class="timer"></div>';
    $("notifs").appendChild(n);
    var timer = n.querySelector(".timer");
    timer.style.width = "100%";
    timer.style.transition = "width " + dur + "ms linear";
    requestAnimationFrame(function () { requestAnimationFrame(function () { timer.style.width = "0%"; }); });
    setTimeout(function () {
      n.classList.add("out");
      setTimeout(function () { n.remove(); }, 220);
    }, dur);
    var all = $("notifs").children;
    while (all.length > 5) all[0].remove();
  }

  // ================= PANELS =================
  function showBinds(d) {
    var panel = $("binds-panel");
    if (!d.visible) { panel.classList.add("hidden"); return; }
    var binds = arr(d.binds);
    $("binds").innerHTML = binds.length ? binds.map(function (b) {
      var status = "";
      if (b.type === "checkbox" || b.type === "slider-checkbox" || b.type === "scrollable-checkbox") status = b.checked ? "ON" : "OFF";
      return '<li class="' + (b.checked ? "on" : "") + '"><span><span class="k">' + esc(b.keyLabel || b.key) + "</span> &nbsp;" +
             esc(b.label) + '</span><span class="s">' + status + "</span></li>";
    }).join("") : '<div class="empty">No keybinds set</div>';
    panel.classList.remove("hidden");
  }

  function showSpectators(d) {
    var panel = $("specs-panel");
    if (!d.visible) { panel.classList.add("hidden"); return; }
    var specs = arr(d.spectators);
    $("spec-count").textContent = specs.length;
    $("specs").innerHTML = specs.length ? specs.map(function (s) {
      return "<li><span>[" + esc(s.id) + "] " + esc(s.name) + '</span><span class="s">' + esc(s.distance) + "</span></li>";
    }).join("") : '<div class="empty">Nobody is spectating</div>';
    panel.classList.remove("hidden");
  }

  // ================= FREECAM =================
  function renderFreecam() {
    var fc = state.fc, n = FC_OPTIONS.length;
    var prev = FC_OPTIONS[(fc.option - 1 + n) % n];
    var cur = FC_OPTIONS[fc.option];
    var next = FC_OPTIONS[(fc.option + 1) % n];
    $("fc-opts").innerHTML = "<span>" + esc(prev) + '</span><span class="cur">' + esc(cur) + "</span><span>" + esc(next) + "</span>";
    var sub = "";
    if (cur === "Shoot Weapon") sub = "Weapon: <b>" + esc(FC_WEAPONS[fc.weapon - 1] || fc.weapon) + "</b>";
    else if (cur === "Shoot Vehicle") sub = "Vehicle: <b>" + esc(FC_VEHICLES[fc.vehicle - 1] || fc.vehicle) + "</b>";
    else if (cur === "Map Destroyer") sub = "Map: <b>" + esc(FC_MAPS[fc.map - 1] || fc.map) + "</b>";
    else if (cur === "Spawn Object") sub = "Object: <b>" + esc(FC_OBJECTS[fc.object - 1] || fc.object) + "</b>";
    $("fc-sub").innerHTML = sub;
    $("fc-sub").style.display = sub ? "block" : "none";
  }

  // ================= MESSAGE HANDLER =================
  function handle(d) {
    if (!d || typeof d !== "object") return;
    switch (d.action) {
      case "startInjection":
        startInjection();
        break;

      case "showUI":
        if (d.visible) {
          if (d.username) $("user").innerHTML = "<b>" + esc(d.username) + "</b>";
          if (d.expiration) $("exp").innerHTML = "Exp <b>" + esc(d.expiration) + "</b>";
          applyMenuData(d);
          $("menu").classList.remove("closed");
        } else {
          $("menu").classList.add("closed");
        }
        break;

      case "updateElements":
        applyMenuData(d);
        break;

      case "keydown":
        setHover(d.index);
        break;

      case "setMenuPosition":
        var m = $("menu");
        if (d.x) {
          m.classList.remove("x-left", "x-center", "x-right");
          m.classList.add("x-" + String(d.x).toLowerCase());
        }
        if (d.y) {
          m.classList.remove("y-top", "y-middle", "y-bottom");
          m.classList.add("y-" + String(d.y).toLowerCase());
        }
        break;

      case "showNotification":
        notify(d);
        break;

      case "updateKeyboard":
        if (d.visible) {
          $("kb-title").textContent = d.title || "Input";
          $("kb-value").textContent = d.value || "";
          $("keyboard").classList.remove("hidden");
        } else {
          $("keyboard").classList.add("hidden");
        }
        break;

      case "displayBinds":
        showBinds(d);
        break;

      case "displaySpectators":
        showSpectators(d);
        break;

      case "displayFreecam":
        if (d.visible) {
          state.fc.option = 0;
          if (d.weaponIndex) state.fc.weapon = d.weaponIndex;
          if (d.vehicleIndex) state.fc.vehicle = d.vehicleIndex;
          if (d.mapIndex) state.fc.map = d.mapIndex;
          if (d.objectIndex) state.fc.object = d.objectIndex;
          renderFreecam();
          $("freecam-wrap").classList.remove("hidden");
        } else {
          $("freecam-wrap").classList.add("hidden");
        }
        break;

      case "scroll":
        var n = FC_OPTIONS.length;
        state.fc.option = d.direction === "up" ? (state.fc.option - 1 + n) % n : (state.fc.option + 1) % n;
        renderFreecam();
        break;

      case "updateWeapon":  state.fc.weapon = d.index;  renderFreecam(); break;
      case "updateVehicle": state.fc.vehicle = d.index; renderFreecam(); break;
      case "updateMap":     state.fc.map = d.index;     renderFreecam(); break;
      case "updateObject":  state.fc.object = d.index;  renderFreecam(); break;

      case "updateFOV":
        var fov = $("fov");
        if (d.enabled && d.show) {
          var r = Number(d.radius) || 100;
          fov.style.width = fov.style.height = (r * 2) + "px";
          fov.classList.remove("hidden");
        } else {
          fov.classList.add("hidden");
        }
        break;
    }
  }

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (typeof d === "string") {
      try { d = JSON.parse(d); } catch (err) { return; }
    }
    try { handle(d); } catch (err) { /* never let one bad message break the menu */ }
  });

  // ================= PREVIEW MODE =================
  // Open menu.html?demo in a normal browser to see the menu with sample data.
  // Keys in preview: Arrow Up/Down, Q/E for tabs, Enter toggles a checkbox, Left/Right changes values.
  if (/[?&]demo/.test(location.search)) {
    document.body.style.background = "#3a3a3a url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22><rect width=%2220%22 height=%2220%22 fill=%22%23444%22/><rect x=%2220%22 y=%2220%22 width=%2220%22 height=%2220%22 fill=%22%23444%22/></svg>')";
    var demoCats = [
      { label: "Self", tabs: [
        { type: "divider", label: "Health" },
        { type: "button", label: "Heal", desc: "Restores your health to full." },
        { type: "checkbox", label: "Godmode", checked: true, desc: "You can't die." },
        { type: "scrollable", label: "Clear Tasks", value: 1, values: ["Primary", "Secondary"], desc: "Clears the character's tasks." },
        { type: "divider", label: "Movement" },
        { type: "slider-checkbox", label: "Fast Run", checked: false, value: 1.5, min: 1, max: 5, step: 0.25, desc: "Run faster." },
        { type: "checkbox", label: "Super Jump", checked: false, desc: "Jump really high." },
        { type: "checkbox", label: "Noclip", checked: false, desc: "Fly through walls." }
      ]},
      { label: "Players", tabs: [
        { type: "checkbox", label: "> 12 - SomePlayer", checked: false, metaData: [
          { key: "Distance", value: "42m" }, { key: "Health", value: 200 }, { key: "Armour", value: 50 },
          { key: "Weapon", value: "Pistol" }, { key: "Vehicle", value: "Adder" }, { key: "Speed", value: "0 km/h" }
        ]},
        { type: "button", label: "Select Everyone" }
      ]},
      { label: "Settings", tabs: [
        { type: "scrollable", label: "Menu Positioning (X)", value: 1, values: ["Left", "Center", "Right"] },
        { type: "scrollable", label: "Menu Positioning (Y)", value: 1, values: ["Top", "Middle", "Bottom"] }
      ]}
    ];
    var ci = 0;
    function demoSend(idx) {
      handle({ action: "updateElements", elements: demoCats[ci].tabs, index: idx, path: ["Main Menu", "Player"], categories: demoCats, categoryIndex: ci });
    }
    handle({ action: "startInjection" });
    setTimeout(function () {
      handle({ action: "showUI", visible: true, elements: demoCats[0].tabs, index: 1, path: ["Main Menu", "Player"],
               categories: demoCats, categoryIndex: 0, username: "Elijah", expiration: "Lifetime" });
      handle({ action: "showNotification", type: "success", title: "Elijah", desc: "Menu loaded. Press PageUp to toggle.", duration: 4000 });
      handle({ action: "displayBinds", visible: true, binds: [{ keyLabel: "F5", label: "Godmode", type: "checkbox", checked: true }, { keyLabel: "F6", label: "Noclip", type: "checkbox", checked: false }] });
    }, 1200);

    document.addEventListener("keydown", function (e) {
      var els = demoCats[ci].tabs, i = state.index;
      function move(dir) {
        var tries = 0;
        do { i = (i + dir + els.length) % els.length; tries++; } while (els[i].type === "divider" && tries < 50);
        handle({ action: "keydown", index: i });
      }
      if (e.key === "ArrowDown") move(1);
      else if (e.key === "ArrowUp") move(-1);
      else if (e.key === "q" || e.key === "e") {
        ci = (ci + (e.key === "e" ? 1 : -1) + demoCats.length) % demoCats.length;
        var first = 0; while (demoCats[ci].tabs[first].type === "divider") first++;
        demoSend(first);
      } else if (e.key === "Enter") {
        var el = els[i];
        if (el.type.indexOf("checkbox") !== -1) { el.checked = !el.checked; demoSend(i); }
        else handle({ action: "showNotification", type: "info", title: "Elijah", desc: "Pressed: " + el.label, duration: 2500 });
      } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        var el2 = els[i], d = e.key === "ArrowRight" ? 1 : -1;
        if (el2.values) {
          el2.value = ((el2.value - 1 + d + el2.values.length) % el2.values.length) + 1;
          if (/Positioning \(X\)/.test(el2.label)) handle({ action: "setMenuPosition", x: el2.values[el2.value - 1] });
          if (/Positioning \(Y\)/.test(el2.label)) handle({ action: "setMenuPosition", y: el2.values[el2.value - 1] });
        } else if (el2.min != null) {
          el2.value = Math.max(el2.min, Math.min(el2.max, el2.value + d * el2.step));
        }
        demoSend(i);
      } else if (e.key === "PageUp") {
        $("menu").classList.toggle("closed");
      }
    });
  }
})();
</script>
</body>
</html>
